<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | BomCorpo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="protegerPagina(); carregarPerfil();">

<nav class="navbar">
  <h1 class="logo">
    <a href="inicio.html">Bom<span>Corpo</span></a>
  </h1>
  <ul>
    <li><a href="inicio.html">Início</a></li>
    <li><a href="treinos.html">Treinos</a></li>
    <li><a href="dieta.html">Plano alimentar</a></li>
    <li><a href="progresso.html">Progresso</a></li>
    <li><a href="perfil.html">Perfil</a></li>
  </ul>
</nav>

<section class="doencas-container">
  <p class="tag">Conta do usuário</p>
  <h2>Meu <span class="destaque">Perfil</span></h2>
  <div class="linha centralizada"></div>

  <div class="cards-doencas">
    <div class="card-coracao card-doenca">
      <h3>Nome</h3>
      <p id="perfilNome"></p>
    </div>

    <div class="card-coracao card-doenca">
      <h3>E-mail</h3>
      <p id="perfilEmail"></p>
    </div>

    <div class="card-coracao card-doenca">
      <h3>Objetivo</h3>
      <p id="perfilObjetivo"></p>
    </div>

    <div class="card-coracao card-doenca">
      <h3>Idade</h3>
      <p id="perfilIdade"></p>
    </div>

    <div class="card-coracao card-doenca">
      <h3>Altura e peso</h3>
      <p id="perfilCorpo"></p>
    </div>

    <div class="card-coracao card-doenca">
      <h3>Treinos por semana</h3>
      <p id="perfilTreinos"></p>
    </div>
  </div>

  <div class="botoes central-botoes">
    <button class="btn secundario" onclick="logout()">Sair da conta</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
