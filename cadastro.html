<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | BomCorpo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <h1 class="logo">
    <a href="index.html">Bom<span>Corpo</span></a>
  </h1>
</nav>

<section class="section auth-container">
  <div class="texto auth-texto">
    <p class="tag">Novo acesso</p>
    <h2>Criar <span class="destaque">Conta</span></h2>
    <div class="linha"></div>

    <p class="desc">
      Crie sua conta para começar sua avaliação física personalizada.
    </p>

    <form class="auth-form" onsubmit="criarConta(event)">
      <div class="input-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required>
      </div>

      <div class="botoes">
        <button type="submit" class="btn">Criar conta</button>
        <button type="button" class="btn secundario" onclick="window.location.href='login.html'">Já tenho conta</button>
      </div>
    </form>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
