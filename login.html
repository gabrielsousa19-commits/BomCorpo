<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BomCorpo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <h1 class="logo">
    <a href="index.html">Bom<span>Corpo</span></a>
  </h1>
</nav>

<section class="section auth-container">
  <div class="texto auth-texto">
    <p class="tag">Acesso ao sistema</p>
    <h2>Entrar no <span class="destaque">BomCorpo</span></h2>
    <div class="linha"></div>

    <p class="desc">
      Entre na sua conta para acessar seus treinos, dieta e progresso.
    </p>

    <form class="auth-form" onsubmit="fazerLogin(event)">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <div class="botoes">
        <button type="submit" class="btn">Entrar</button>
        <button type="button" class="btn secundario" onclick="window.location.href='cadastro.html'">Criar conta</button>
      </div>
    </form>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
